<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Central Pet - Página Não Encontrada (404)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

</head>

<body class="error-page">

  <!-- Cabeçalho (Barra Laranja Superior) -->
  <header class="topbar">
    <div class="brand-container">
      <a href="index.html" class="brand-link">
        <img src="../img/logo-centralpet.png" alt="Logo Central Pet" class="brand-logo">
        <span class="brand-title">Central <span class="brand-highlight">Pet</span></span>
      </a>
    </div>
  </header>

  <!-- Área Principal (Fundo de Patinhas) -->
  <main class="error-main">

    <div class="error-card">
      <span class="error-code">404</span>
      <h1 class="error-title">Página Não Encontrada</h1>

      <p class="error-description">
        O endereço digitado pode estar incorreto ou a página que você procura foi movida ou removida.
      </p>

      <div class="error-help">
        <p class="help-title"><strong>O que você pode fazer?</strong></p>
        <ul class="help-list">
          <li class="help-item">Verifique se há erros de digitação na URL.</li>
          <li class="help-item">
            <a href="#" id="btn-voltar" class="help-link">Voltar para a página anterior</a>
          </li>
          <li class="help-item">
            <a href="index.html" class="help-link" rel="noopener">Ir para a página inicial</a>
          </li>
        </ul>
      </div>

      <!-- Botão de Ação Principal -->
      <div class="error-actions">
        <a href="index.html" class="btn-primary">Voltar ao Início</a>
      </div>
    </div>

  </main>

  <script src="../js/erro.js" defer></script>


</body>

</html>
