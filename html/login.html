<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Pet - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

  <!-- Cabeçalho (Barra Laranja Superior) -->
  <header class="topbar">
    <div class="brand-container">
      <a href="index.html" class="brand-link">
        <img src="../img/logo-centralpet.png" alt="Logo Central Pet" class="brand-logo">
        <span class="brand-title">Central <span class="brand-highlight">Pet</span></span>
      </a>
    </div>
  </header>

  <!-- Área Principal (Fundo de Patinhas) -->
  <main class="login-main">

    <h1 class="page-title">Login</h1>

    <!-- Card/Painel de Login Centralizado -->
    <div class="login-card">
      <form action="/logar" method="POST" class="login-form" novalidate>

        <!-- Campo E-mail -->
        <div class="form-group">
          <label for="user-email" class="form-label">E-mail:</label>
          <input type="email" id="user-email" name="email" class="form-input" placeholder="Digite seu Email" required
            maxlength="254" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
        </div>

        <!-- Campo Senha -->
        <div class="form-group">
          <label for="senha" class="form-label">Senha:</label>
          <input type="password" id="senha" name="senha" class="form-input" placeholder="Digite Sua senha" required>
        </div>

        <!-- Opção Salvar Senha -->
        <div class="form-group-checkbox">
          <input type="checkbox" id="salvarSenha" name="salvarSenha" class="checkbox-input" checked>
          <label for="salvarSenha" class="checkbox-label">
            <strong>Sim</strong><br>
            <span class="checkbox-subtext">Deseja salvar sua senha?</span>
          </label>
        </div>

        <!-- Link Esqueci a Senha (Opcional) -->
        <div class="form-forgot">
          <a href="esqueceuSenha.html" class="forgot-link">Esqueci minha senha</a>
        </div>

        <!-- Botão de Envio (Vermelho) -->
        <div class="form-actions">
          <button type="submit" id="confirmarLogin" class="btn-primary">Confirmar</button>
        </div>

      </form>
    </div>

  </main>

  <!-- Rodapé (Faixa Azul Escura Inferior) -->
  <footer class="footer-bar">
    <!-- Conteúdo do rodapé -->
  </footer>

  <script src="../js/login.js" defer></script>
</body>
